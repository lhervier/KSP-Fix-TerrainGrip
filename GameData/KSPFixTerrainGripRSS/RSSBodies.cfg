// The terrain of the bodies of Real Solar System, for Terrain Grip Fix: the material of each body, and of the
// biomes that differ from it. Biomes go by their internal name, as RSS defines them. Kopernicus renames Kerbin to
// Earth once the game is loaded: the fix reads the name in flight. Every node needs RealSolarSystem: without it,
// this pack does nothing. The gas giants have no ground and are left out.

TERRAINGRIP_BODY:NEEDS[RealSolarSystem]
{
    name = Earth
    material = soil
    BIOME
    {
        name = Shores
        material = sand
    }
    BIOME
    {
        name = Desert
        material = sand
    }
    BIOME
    {
        name = Water
        material = sand
    }
    BIOME
    {
        name = Ice Caps
        material = snow
    }
    BIOME
    {
        name = Mountains
        material = rock
    }
}

TERRAINGRIP_BODY:NEEDS[RealSolarSystem]
{
    name = Moon
    material = regolith
}

