// The ground of the stock bodies, for Terrain Grip Fix: the material of each body, and of the biomes that differ from it.
// Biomes go by their internal name, the one of the English game. A planet pack adds its bodies the same way; a mod
// that adds a biome to a stock body adds a BIOME node with ModuleManager: @TERRAINGRIP_BODY[Mun] { BIOME { ... } }.

TERRAINGRIP_BODY
{
    name = Kerbin
    material = soil
    BIOME
    {
        name = Water
        material = sand
    }
    BIOME
    {
        name = Shores
        material = sand
    }
    BIOME
    {
        name = Deserts
