// The materials of the terrain, and their friction: the one an ordinary part has on them. The same value gives the
// grip of the wheels and the friction of the terrain's colliders, so that a wheel and a crate on the same ground feel
// the same ground.
//
// The colliders of the terrain get friction / (partFriction x patchFactor), combined by multiplication; so do the parts
// without a physic material of their own (partFriction, in place of the game's default, "Metal" 0.25 combined by its
// maximum): a part resting on a terrain gets the friction below, and two parts still rub as in the game. The grip pads
// keep their values, multiplied too.
// A wheel gets the factor of its class times the friction of the material over the reference's: a tyre on the soil of Kerbin keeps the grip it has in the game; the
// metal foot of a landing leg, whose own curve is that of ice, slides on ice and is held by soil, sand or regolith.
// The bodies and their biomes are in the packs (KSPFixTerrainGripStock...): on a body no pack names, nothing changes.

TERRAINGRIP
{
    reference = soil
    partFriction = 0.5
    dynamicRatio = 0.85
    // PhysX caps the friction of each of the two anchors of a flat contact at the coefficient times the normal force
    // of the whole contact: a flat contact rubs at twice the combined coefficient. The terrain is divided by it.
    patchFactor = 2
}

TERRAINGRIP_WHEELCLASS
{
    name = tyre
    factor = 1
}
TERRAINGRIP_WHEELCLASS
{
    name = metal
    factor = 3
}

TERRAINGRIP_MATERIAL
{
    name = concrete
    friction = 1.0
}
