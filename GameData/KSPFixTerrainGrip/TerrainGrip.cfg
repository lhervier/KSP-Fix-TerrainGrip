// The materials of the ground, and the grip each gives a class of wheel: a factor on the wheel's own tyre curve, which
// the grip of the game is 1 of. A tyre on the soil of Kerbin keeps its grip; the metal foot of a landing leg, whose own
// curve is that of ice, slides on ice and is held by loose ground. A class of wheel a material does not name gets 1.
// The bodies and their biomes are in the packs (KSPFixTerrainGripStock...): on a body no pack names, nothing changes.

TERRAINGRIP_MATERIAL
{
    name = soil
    tyre = 1.0
    metal = 3.0
}
TERRAINGRIP_MATERIAL
{
    name = rock
    tyre = 1.0
    metal = 1.5
}
TERRAINGRIP_MATERIAL
{
    name = regolith
    tyre = 0.8
    metal = 3.0
}
TERRAINGRIP_MATERIAL
{
    name = sand
    tyre = 0.7
    metal = 3.0
}
TERRAINGRIP_MATERIAL
{
    name = snow
    tyre = 0.5
    metal = 2.0
}
TERRAINGRIP_MATERIAL
{
    name = ice
    tyre = 0.25
    metal = 1.0
}
TERRAINGRIP_MATERIAL
{
    name = concrete
    tyre = 1.0
    metal = 2.0
}
TERRAINGRIP_MATERIAL
{
    name = metal
    tyre = 0.7
    metal = 1.0
}

