// What is not terrain: a building or a launch site (static), a part of a vessel, an asteroid, a comet, a rock of the
// scatter or a surface feature (rock). Only the wheels read these: the colliders of statics, parts and rocks keep
// their own physic material.
TERRAINGRIP_SURFACES
{
    static = concrete
    part = metal
    asteroid = rock
    comet = ice
    rock = rock
}
