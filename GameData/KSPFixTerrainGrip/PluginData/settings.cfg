// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time what a wheel
// stands on, or its grip, changes.
logLevel = Info

// Whether wheels and landing legs get the grip of the terrain they stand on, as the configuration packs give it
// (true), or the same grip everywhere, as in stock (false).
terrainGrip = true

// Whether automatic friction keeps its value on Kerbin on every body of the configuration packs (true), or drops with
// gravity, as in stock (false).
kerbinAutoFriction = true
